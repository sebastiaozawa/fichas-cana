<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1E5631">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fichas Cana">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Cristal Cana – Fichas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#DCE4DD}
body{font-family:Inter,system-ui,sans-serif;color:#18241B;-webkit-tap-highlight-color:transparent}
button,input,textarea{font-family:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:#EEF2EC;display:flex;flex-direction:column;position:relative}
.hdr{background:#1E5631;color:#fff;padding:16px 16px 12px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;z-index:5}
.row{display:flex;align-items:center}
.sb{justify-content:space-between}
.sub{font-size:12px;color:#CFE6D5;font-weight:500}
.h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.pill{display:flex;align-items:center;gap:6px;background:#2B6B40;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:999px;background:#8FD19E}
.car{background:#2B6B40;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#1E5631;border-radius:8px;padding:3px 8px;font-size:14px;font-weight:800}
.chip small{font-size:11px;font-weight:700;color:#CFE6D5}
.bar{height:8px;border-radius:999px;background:#1E5631;overflow:hidden}
.bar>div{height:100%;border-radius:999px;background:#8FD19E;transition:width .4s ease}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#DCE4DD;padding:4px;border-radius:14px;margin:10px 14px 2px}
.tab{height:44px;border:none;border-radius:10px;font-size:14px;font-weight:700;background:transparent;color:#4A574E}
.tab.on{background:#fff;color:#1E5631;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.list{flex:1;padding:10px 14px 16px;display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;border:2px solid #1E5631;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.num{width:40px;height:40px;flex-shrink:0;border-radius:12px;background:#1E5631;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.lbl{font-size:12px;font-weight:600;color:#55645A}
.cap{font-size:11px;font-weight:700;color:#55645A;text-transform:uppercase;letter-spacing:.05em}
.ped{flex-shrink:0;display:flex;flex-direction:column;align-items:center;background:#E3EEFA;color:#123A6B;border:1px solid #A9C7EC;border-radius:14px;padding:4px 10px 6px}
.ped img{width:52px;height:34px;object-fit:contain}
.ped b{font-size:20px;font-weight:900;white-space:nowrap;line-height:1.1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{height:46px;border-radius:12px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;border:none}
.b-maps{background:#1A73E8;color:#fff}
.b-off{background:#EEF1EE;color:#5F6B63;font-weight:600;font-size:13px}
.b-save{background:#123A6B;color:#fff}
.b-upd{background:#fff;color:#123A6B;border:2px solid #A9C7EC}
.step{display:flex;flex-direction:column;align-items:center;border-radius:12px;padding:6px 2px;background:#F4F7F4;border:2px solid transparent}
.step.chg{background:#FFF4D6;border-color:#F2B705}
.step .v{min-width:22px;text-align:center;font-size:22px;font-weight:800}
.pm{width:36px;height:44px;border:none;background:transparent;font-size:24px;font-weight:700;color:#1E5631}
.warn{display:flex;gap:8px;align-items:flex-start;background:#FFF4D6;border:1px solid #F2B705;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;color:#5C4300}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px;border-radius:14px;text-align:left;border:2px solid #D5DED7;background:#fff;color:#2E3B32;font-size:15px;font-weight:800;letter-spacing:.03em;width:100%}
.opt.pago.on{border-color:#15803D;background:#EEF8F1;color:#15803D}
.opt.fiado.on{border-color:#DC2626;background:#FEF2F2;color:#DC2626}
.opt.div.on{border-color:#A16207;background:#FEF9E7;color:#A16207}
.ic{width:30px;height:30px;flex-shrink:0;border-radius:999px;display:flex;align-items:center;justify-content:center}
.ic.s{width:24px;height:24px}
.ic.xs{width:18px;height:18px}
.ic.g{background:#16A34A;color:#fff}.ic.r{background:#DC2626;color:#fff}.ic.y{background:#EAB308;color:#422006}
.divbox{display:flex;align-items:center;justify-content:space-between;background:#FEF9E7;border:1px solid #F3D98A;border-radius:12px;padding:4px 6px 4px 14px;font-size:14px;font-weight:600;color:#713F12}
.divbox .pm{color:#854D0E}
.ok{height:56px;border:none;border-radius:14px;background:#1E5631;color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.next{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #D5DED7;border-radius:14px;padding:10px 12px;min-height:56px;text-align:left;color:#18241B;width:100%}
.n2{width:32px;height:32px;flex-shrink:0;border-radius:10px;background:#E3EAE4;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800}
.mini{display:flex;align-items:center;gap:4px;background:#E3EEFA;border:1px solid #A9C7EC;border-radius:10px;padding:2px 8px 2px 4px;font-size:15px;font-weight:900;color:#123A6B;white-space:nowrap}
.mini img{width:28px;height:18px;object-fit:contain}
.done{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #D5DED7;border-radius:14px;padding:10px 10px 10px 12px}
.tag{align-self:flex-start;font-size:11px;font-weight:700;color:#5C4300;background:#FFF4D6;border-radius:6px;padding:2px 6px}
.fix{height:40px;padding:0 12px;border-radius:10px;border:1px solid #C9D4CB;background:#fff;font-size:13px;font-weight:700;color:#1E5631}
.foot{padding:12px 14px 18px;background:#fff;border-top:1px solid #D5DED7;position:sticky;bottom:0;display:flex;flex-direction:column;gap:8px}
.ghost{height:50px;border-radius:14px;border:2px solid #1E5631;color:#1E5631;background:#fff;font-size:16px;font-weight:700;width:100%}
.ov{position:fixed;inset:0;background:rgba(15,30,20,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;padding:22px 18px 26px;display:flex;flex-direction:column;gap:14px}
.box{background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1px solid #D5DED7}
.kv{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #EEF2EC}
.kv:last-child{border-bottom:none}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#18241B;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;max-width:90%;text-align:center}
input.txt,textarea{width:100%;border-radius:12px;border:1px solid #C9D4CB;background:#fff;padding:10px 12px;font-size:16px;color:#18241B}
/* ficha */
.fwrap{padding:12px;overflow-x:auto}
#ficha{width:595px;min-height:842px;margin:0 auto;background:#fff;padding:30px 32px 24px;display:flex;flex-direction:column;gap:14px;color:#18241B;font-family:Inter,system-ui,sans-serif}
#ficha table{width:100%;border-collapse:collapse;font-size:11px}
#ficha th{background:#1E5631;color:#fff;font-weight:700;padding:7px 6px;text-align:left;font-size:10.5px}
#ficha td{padding:6px;border-top:1px solid #E1E8E2}
#ficha tr:nth-child(even) td{background:#F8FAF8}
#ficha .c{text-align:center}
#ficha .chg{background:#FFE9A8!important;font-weight:800;color:#5C4300}
.fbox{border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
/* ---------- animações (suaves, estilo iOS) ---------- */
:root{--ease:cubic-bezier(.22,1,.36,1);--ease-io:cubic-bezier(.4,0,.2,1)}
button,.btn,.opt,.next,.tab,.step,.fix,.exit{transition:transform .18s var(--ease),background-color .28s var(--ease),border-color .28s var(--ease),color .28s var(--ease),box-shadow .28s var(--ease),opacity .2s}
button:active,.btn:active,.next:active{transform:scale(.97)}
.opt:active{transform:scale(.985)}
.exit{width:38px;height:38px;border-radius:12px;border:none;background:#2B6B40;color:#fff;display:flex;align-items:center;justify-content:center}
.tab.on{transition:background-color .3s var(--ease),box-shadow .3s var(--ease),color .3s}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.55)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:32}to{stroke-dashoffset:0}}
@keyframes turnBack{from{transform:rotate(140deg)}to{transform:rotate(0)}}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.screen{animation:fadeIn .35s var(--ease)}
.enter{animation:cardIn .5s var(--ease) both}
.fx-in{animation:fadeUp .35s var(--ease) both}
.stagger>*{animation:fadeUp .42s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:.035s}.stagger>*:nth-child(3){animation-delay:.07s}.stagger>*:nth-child(4){animation-delay:.1s}
.stagger>*:nth-child(5){animation-delay:.13s}.stagger>*:nth-child(6){animation-delay:.16s}.stagger>*:nth-child(n+7){animation-delay:.19s}
.pop{animation:pop .48s var(--ease)}
.ic.pop.g path,.ic.pop.r path,.pop>svg path{stroke-dasharray:32;animation:draw .4s .1s var(--ease) both}
.ic.pop.y svg{animation:turnBack .55s var(--ease)}
.bump{display:inline-block;animation:bump .38s var(--ease)}
.ov.open{animation:fadeIn .22s ease}
.ov.open .sheet{animation:sheetUp .42s var(--ease)}
.toast{animation:toastIn .32s var(--ease) both}
.shake{animation:shake .4s var(--ease)}
.bar>div{transition:width .7s var(--ease)}
.opt .ic{transition:transform .25s var(--ease)}
.opt:not(.on) .ic{filter:saturate(.35);opacity:.75}
.opt.on .ic{filter:none;opacity:1}
#app{overflow-x:hidden}
/* fases */
.fases{display:flex;align-items:center;gap:6px;margin-top:4px}
.fase{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#9FC4A9;white-space:nowrap}
.fase span{width:20px;height:20px;border-radius:999px;border:1.5px solid #4E8A62;display:flex;align-items:center;justify-content:center;font-size:11px}
.fase.atual{color:#fff}.fase.atual span{background:#fff;color:#1E5631;border-color:#fff}
.fase.feita span{background:#8FD19E;border-color:#8FD19E;color:#123A20}
.fase-linha{flex:1;height:2px;min-width:8px;background:#4E8A62;border-radius:2px}
/* caminhão com carga */
.truck{position:relative;flex-shrink:0;width:150px;height:76px}
.truck-img{position:absolute;left:0;bottom:0;width:150px;height:55px;object-fit:contain}
.carga{position:absolute;left:8px;bottom:39px;width:50px;height:32px}
.carga img{position:absolute;width:14px;height:9px;object-fit:contain;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25));transition:opacity .3s}
.carga img.sai{animation:sai .7s var(--ease) forwards}
@keyframes sai{0%{transform:none;opacity:1}40%{transform:translateY(-10px) rotate(-12deg);opacity:1}100%{transform:translate(-14px,-24px) rotate(-30deg);opacity:0}}
/* saída da entrega com linhas de velocidade */
.card{position:relative}
.vel{position:absolute;left:-58px;top:50%;transform:translateY(-50%);width:50px;height:46px;display:none;flex-direction:column;justify-content:space-between;pointer-events:none}
.vel i{display:block;height:5px;border-radius:5px;background:#1E5631;margin-left:auto}
.vel i:nth-child(1){width:70%}.vel i:nth-child(2){width:100%}.vel i:nth-child(3){width:55%}
.card.saindo .vel{display:flex;animation:velIn .18s ease both}
@keyframes velIn{from{opacity:0;transform:translate(14px,-50%) scaleX(.3)}to{opacity:1;transform:translate(0,-50%)}}
/* celebração */
.celebra .ring{transform-origin:60px 60px;opacity:0}
.celebra .dot-b{opacity:0}
.celebra.play .ring{animation:ring 1.1s var(--ease) forwards}
.celebra.play .r2{animation-delay:.12s}.celebra.play .r3{animation-delay:.24s}
.celebra.play .dot-b{animation:burst .9s .15s var(--ease) forwards}
.celebra .disc{transform-origin:60px 60px}
.celebra.play .disc{animation:pop .55s var(--ease) both}
.celebra .tick{stroke-dasharray:44}
.celebra.play .tick{animation:draw44 .45s .3s var(--ease) both}
.celebra.play .cel-t{animation:fadeUp .5s .35s var(--ease) both}
.celebra.play .cel-s{animation:fadeUp .5s .45s var(--ease) both}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes burst{0%{transform:none;opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
@keyframes draw44{from{stroke-dashoffset:44}to{stroke-dashoffset:0}}
/* brilho */
.brilho{position:relative;overflow:hidden}
.brilho::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:shine 2.8s 1s ease-in-out infinite}
@keyframes shine{0%{left:-60%}35%,100%{left:130%}}
/* transição entre fases */
.sweep{position:fixed;inset:0;z-index:50;pointer-events:none;display:flex;transform:translateX(-110%)}
.sweep i{flex:1;transform:skewX(-10deg) scaleX(1.25)}
.sweep i:nth-child(1){background:#8FD19E}.sweep i:nth-child(2){background:#2B6B40}.sweep i:nth-child(3){background:#1E5631}
/* aguardando */
.espera{display:flex;gap:6px}.espera i{width:10px;height:10px;border-radius:99px;background:#8FD19E;animation:esp 1.2s ease-in-out infinite}
.espera i:nth-child(2){animation-delay:.15s}.espera i:nth-child(3){animation-delay:.3s}
@keyframes esp{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-7px);opacity:1}}
/* configurações */
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#EEF2EC;padding:4px;border-radius:12px}
.seg{height:42px;border:none;border-radius:9px;background:transparent;font-weight:700;font-size:14px;color:#4A574E}
.seg.on{background:#fff;color:#1E5631;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.switch-row{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:none;padding:6px 0;text-align:left;color:inherit}
.switch{width:50px;height:30px;border-radius:99px;background:#C9D4CB;position:relative;flex-shrink:0;transition:background .25s var(--ease)}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--ease)}
.switch.on{background:#16A34A}.switch.on i{transform:translateX(20px)}
/* ---------- modo escuro ---------- */
html.dark{color-scheme:dark}
.dark body{background:#0B110D}
.dark #app{background:#111A15;color:#E4ECE6}
.dark .hdr{background:#0E2A18}
.dark .car,.dark .exit{background:#173A23}
.dark .chip{background:#0E2A18}
.dark .bar{background:#0E2A18}
.dark .card,.dark .box,.dark .done,.dark .next,.dark .opt,.dark .fix,.dark .ghost,.dark .foot,.dark .sheet,.dark input.txt,.dark textarea,.dark .seg.on{background:#1A241E;border-color:#2C3A31;color:#E4ECE6}
.dark .card{border-color:#3E8A57}
.dark .ghost{color:#8FD19E;border-color:#3E8A57}
.dark .fix{color:#8FD19E}
.dark .tabs,.dark .segs{background:#1A241E}.dark .tab,.dark .seg{color:#9FB1A5}.dark .tab.on{background:#26352C;color:#CFE6D5}
.dark .step{background:#222E27}.dark .step.chg{background:#3A3010;border-color:#B8901A}
.dark .lbl,.dark .cap{color:#9FB1A5}
.dark .n2{background:#26322B;color:#E4ECE6}
.dark .pm{color:#8FD19E}
.dark .warn{background:#352B0E;border-color:#7A6216;color:#F5DE9A}
.dark .opt.pago.on{background:#12301E;color:#6EE09A;border-color:#16A34A}
.dark .opt.fiado.on{background:#3A1515;color:#FF8A8A;border-color:#DC2626}
.dark .opt.div.on{background:#33290C;color:#F3C64A;border-color:#A16207}
.dark .divbox{background:#33290C;border-color:#5A4A16;color:#F5DE9A}.dark .divbox .pm{color:#F3C64A}
.dark .ped,.dark .mini{background:#13243A;border-color:#2C4A6E;color:#BBD5F5}
.dark .b-off{background:#222E27;color:#9FB1A5}
.dark .b-upd{background:#13243A;color:#BBD5F5;border-color:#2C4A6E}
.dark .vel i{background:#8FD19E}
.dark .tag{filter:brightness(.85)}
.dark .switch{background:#3A4A40}
.dark [style*="background:#fff"]:not(#ficha *):not(#ficha),.dark [style*="background:#F4F7F4"]:not(#ficha *),.dark [style*="background:#EEF2EC"]:not(#ficha *){background:#222E27!important}
.dark [style*="background:#FEF4F4"]:not(#ficha *),.dark [style*="background:#FEF2F2"]:not(#ficha *){background:#3A1515!important}
.dark [style*="background:#FEFAEB"]:not(#ficha *),.dark [style*="background:#FFF4D6"]:not(#ficha *){background:#33290C!important}
.dark [style*="background:#F3FCF6"]:not(#ficha *),.dark [style*="background:#EEF8F1"]:not(#ficha *){background:#12301E!important}
.dark [style*="background:#E3EEFA"]:not(#ficha *){background:#13243A!important}
.dark [style*="color:#18241B"]:not(#ficha *),.dark [style*="color:#2E3B32"]:not(#ficha *){color:#E4ECE6!important}
.dark [style*="color:#55645A"]:not(#ficha *),.dark [style*="color:#4A574E"]:not(#ficha *),.dark [style*="color:#5F6B63"]:not(#ficha *){color:#9FB1A5!important}
.dark [style*="color:#1E5631"]:not(#ficha *):not(.ok){color:#8FD19E!important}
.dark [style*="color:#123A6B"]:not(#ficha *){color:#BBD5F5!important}
.dark [style*="border:2px solid #D5DED7"]:not(#ficha *),.dark [style*="border:2px solid #C9D4CB"]:not(#ficha *){border-color:#2C3A31!important}
.dark #ficha{color:#18241B}
/* pagamentos em R$ */
.pix{display:inline-flex;align-items:center;justify-content:center;padding:2px 6px;border-radius:6px;background:#1A73E8;color:#fff;font-weight:900;letter-spacing:.04em;flex-shrink:0;line-height:1.2}
.pixinfo{display:flex;gap:10px;align-items:flex-start;background:#EFF4FF;border:1px solid #BFD0F5;border-radius:12px;padding:10px 12px;font-size:13px;color:#1E3A8A;font-weight:500}
.recibo-aviso{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600;color:#14532D;background:#EEF8F1;border-radius:10px;padding:8px 10px}
.recibo-aviso svg{width:16px;height:16px;flex-shrink:0}
.linkbtn{border:none;background:none;padding:2px 0;color:#1A73E8;font-weight:700;font-size:12px;text-decoration:underline;cursor:pointer}
.sel{height:46px;border-radius:12px;border:1px solid #C9D4CB;background:#fff;padding:0 10px;font-family:inherit;font-size:15px;color:#18241B;width:100%}
.recibo{display:flex;flex-direction:column;gap:7px;background:#FFFDF7;border:1px solid #E7DFC6;border-radius:14px;padding:16px;font-size:14px;color:#18241B;box-shadow:0 2px 0 #E7DFC6}
.recibo-corte{border-top:2px dashed #D9CFAF;margin:4px 0}
.recibo-status{display:flex;gap:6px;align-items:center;font-size:11.5px;font-weight:600;color:#5C4300;background:#FFF4D6;border-radius:8px;padding:6px 8px}

  [idPorNome('Engenho – Policlínica Planalto')]: { p: 0, m: 0, g: 0, ajuste: 392 },

const PRECO = { p: 25, m: 26, g: 24 };

const TAM_LONGO = { p: 'P (limpo)', m: 'M (limpo)', g: 'Bruto (como vem do mato)' };
const HORA_LIMITE = 22;

const brl = (v) => 'R$ ' + (Math.round((+v || 0) * 100) / 100).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const valorDe = (p, m, g) => p * PRECO.p + m * PRECO.m + g * PRECO.g;

const numBR = (t) => { const s = String(t || '').replace(/[^\d,.]/g, ''); if (!s) return 0; const n = s.includes(',') ? s.replace(/\./g, '').replace(',', '.') : s; return Math.round((parseFloat(n) || 0) * 100) / 100; };
function amanha() { const d = new Date(); d.setDate(d.getDate() + 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function brData(iso) { const [y, m, d] = iso.split('-'); return d + '/' + m + '/' + y; }
function contasDemo() { const c = {}; Object.entries(SALDOS_DEMO).forEach(([id, v]) => { c[id] = { ...v }; }); return c; }
function novoDono() {

  return { tab: 'carga', draft, lido: {}, avisos: [], reserva: { ...RESERVA_INI }, carga: cargaVazia(), perfis: {}, dataIso: amanha(), contas: contasDemo(), pix: [], compLidos: [], compAvisos: [], msg: MSG_PADRAO, conferido: null, historico: [], publicado: null };
}
function novo() {

    abast: { valor: '', forma: '', foto: null },

    gpsSeed: true, gpsMaster: { ...GPS_DEMO }, dono: novoDono(), recibos: [], reciboSeq: 0, cadVer: CAD_VER

let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || novo(); } catch (e) { S = novo(); }

let fotosPedidos = [];
let lendo = null;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch (e) { return false; } }
function set(patch) { Object.assign(S, patch); save(); render(); }
function upd(id, fn) { const c = S.clientes.find((x) => x.id === id); fn(c); save(); render(); }
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
function cad(id) { const b = CAD[id - 1] || { nome: '?', tels: '', bairro: '', cidade: '', contato: '', obs: '', ficha: '', trecho: '', num: '' }; const o = (S && S.dono && S.dono.perfis && S.dono.perfis[id]) || {}; return { ...b, ...o }; }
const grupo = (id) => { const c = cad(id); return c.ficha + ' · ' + c.trecho; };
function telsDe(id) {
  return String(cad(id).tels || '').split('/').map((t) => t.trim()).filter(Boolean).map((txt) => {
    let ddd = '65'; const m = txt.match(/^\((\d{2})\)/); if (m) ddd = m[1];
    let d = txt.replace(/^\(\d{2}\)/, '').replace(/\D/g, '');
    if (d.length === 8 && /^[6-9]/.test(d)) d = '9' + d;
    const cel = d.length === 9 && d[0] === '9'; const fixo = d.length === 8;
    return { txt: '(' + ddd + ') ' + (cel ? d.slice(0, 5) + '-' + d.slice(5) : fixo ? d.slice(0, 4) + '-' + d.slice(4) : txt), wa: cel ? '55' + ddd + d : '', tel: cel || fixo ? '+55' + ddd + d : '', ok: cel || fixo };
  });
}
const zapDe = (id, txt) => { const t = telsDe(id).find((x) => x.wa); return 'https://wa.me/' + (t ? t.wa : '') + '?text=' + encodeURIComponent(txt); };
const lugar = (id) => { const c = cad(id); return [c.bairro, c.cidade].filter(Boolean).join(' · '); };
const buscaDe = (id) => norm([cad(id).nome, cad(id).contato, cad(id).bairro, cad(id).cidade, cad(id).trecho, cad(id).tels].join(' '));
const cabGrupo = (txt) => `<div class="grp" data-grp>${esc(txt)}</div>`;
const filtro = (ph) => `<input class="txt filtro" type="search" placeholder="${ph}" style="height:46px;font-size:15px" aria-label="${ph}">`;
function comGrupos(ids, fn) { let ult = ''; return ids.map((id) => { const g = grupo(id); const h = g !== ult ? cabGrupo(g) : ''; ult = g; return h + fn(id); }).join(''); }
const fmt = (p, m, g) => [p && p + ' P', m && m + ' M', g && g + ' Bruto'].filter(Boolean).join(' · ') || 'nada';
const fmtC = (p, m, g) => [p && p + 'P', m && m + 'M', g && g + ' Bruto'].filter(Boolean).join(' ') || '—';
const tot = (c) => c.p + c.m + c.g;
function diffs(c) { return [['p', 'P'], ['m', 'M'], ['g', 'Bruto']].map(([k, L]) => ({ k, L, d: c[k] - c['p' + k] })).filter((x) => x.d); }
function diffTxt(c) { return c.nome + ' levou ' + diffs(c).map((x) => Math.abs(x.d) + (Math.abs(x.d) === 1 ? ' feixe ' : ' feixes ') + x.L + ' a ' + (x.d > 0 ? 'mais' : 'menos')).join(' e ') + ' do que o pedido'; }
const diffTag = (c) => diffs(c).map((x) => (x.d > 0 ? '+' : '−') + Math.abs(x.d) + ' ' + x.L).join(' ');
function noCarro() { const r = { p: S.carro.p, m: S.carro.m, g: S.carro.g }; S.clientes.filter((c) => c.done).forEach((c) => { r.p -= c.p; r.m -= c.m; r.g -= c.g; }); return r; }

  return vHeader() + `<div class="tabs"><button class="tab ${S.tab === 'pend' ? 'on' : ''}" data-act="tab" data-v="pend">A entregar (${pend.length})</button><button class="tab ${S.tab === 'ent' ? 'on' : ''}" data-act="tab" data-v="ent">Entregues (<span class="${fx.tabBump ? 'bump' : ''}" style="display:inline-block">${ent.length}</span>)</button></div>
  <div class="list ${fx.list ? 'stagger' : ''}">${body}</div>
  <div class="foot"><button class="${pend.length ? 'ghost' : 'ok brilho'}" data-act="go" data-v="fechar">Fechar rota</button></div>` + vDialog();
}

function resumo() {
  const ent = S.clientes.filter((c) => c.done);
  const din = ent.filter((c) => c.din);
  const pix = ent.filter((c) => !c.din);
  const pends = ent.filter((c) => c.pendOn && c.pendDin > 0);
  const sum = (a, f) => a.reduce((s, c) => s + f(c), 0);
  const e = { p: sum(ent, (c) => c.p), m: sum(ent, (c) => c.m), g: sum(ent, (c) => c.g) };
  const nc = noCarro();
  const vDin = sum(din, val); const vPend = sum(pends, (c) => c.pendDin);
  const comb = S.abast.forma === 'Dinheiro' ? numBR(S.abast.valor) : 0;
  const recs = S.recibos.filter((r) => r.data === S.data && r.status !== 'cancelado');
  return { ent, din, pix, pends, e, nc, pend: S.clientes.filter((c) => !c.done),
    vTotal: sum(ent, val), vPix: sum(pix, val), vDin, vPend, dinheiro: vDin + vPend, comb, entregar: vDin + vPend - comb, recs,
    difs: ent.filter((c) => diffs(c).length) };
}

    </div>

      <tbody>${linhas}<tr><td></td><td style="font-weight:800;background:#EEF2EC;border-top:2px solid #1E5631">Total</td><td class="c" style="font-weight:800;background:#EEF2EC;border-top:2px solid #1E5631">${pedTot}</td><td class="c" style="font-weight:800;background:#EEF2EC;border-top:2px solid #1E5631">${R.e.p + R.e.m + R.e.g}</td><td class="c" style="font-weight:800;background:#EEF2EC;border-top:2px solid #1E5631;white-space:nowrap">${brl(R.vTotal).replace('R$ ', '')}</td><td style="background:#EEF2EC;border-top:2px solid #1E5631;font-size:9.5px;font-weight:700">PIX pendente ${brl(R.vPix)} · Dinheiro ${brl(R.vDin)}</td><td style="background:#EEF2EC;border-top:2px solid #1E5631;font-size:9.5px;font-weight:700;color:#713F12">${brl(R.vPend)}</td></tr></tbody></table>

      ${box('#F1FAF4', '#BFE3CB', icG('xs', 10), '#14532D', 'DINHEIRO COM O MOTORISTA', brl(R.dinheiro), 'Hoje ' + brl(R.vDin) + ' + pendências ' + brl(R.vPend))}
      ${box('#FFFBEB', '#F2D37A', I.fuel(12), '#5C4300', 'ENTREGAR AO DONO', brl(R.entregar), R.comb ? 'Descontado combustível ' + brl(R.comb) : 'Sem desconto de combustível')}

      <div class="fbox" style="border:1px solid #F2D37A;background:#FFFBEB;gap:4px"><b style="font-size:9.5px;color:#5C4300">ENTREGUE DIFERENTE DO PEDIDO</b>${R.difs.length ? R.difs.map((c) => `<span><b>${esc(c.nome)}</b>: pediu ${fmtC(c.pp, c.pm, c.pg)}, levou ${fmtC(c.p, c.m, c.g)} (${diffTag(c)})</span>`).join('') : '<span>Nenhuma diferença</span>'}</div>

          <div style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:900">R$ ${esc(S.abast.valor || '—')}</span><span>Pago com: <b>${esc(S.abast.forma || '—')}</b></span><span>${S.abast.foto ? 'Comprovante anexado ao lado' : '<b style="color:#B91C1C">Sem comprovante</b>'}</span></div>
          ${S.abast.foto ? `<img src="${S.abast.foto}" alt="" style="width:78px;height:104px;object-fit:cover;border-radius:4px;border:1px solid #C9D4CB">` : ''}

    </div>
    <div class="row sb" style="margin-top:auto;align-items:flex-end;font-size:9px;color:#55645A"><span>Gerado pelo app em ${new Date().toLocaleString('pt-BR')}</span><span style="display:flex;flex-direction:column;align-items:center;gap:4px;width:150px"><span style="width:100%;border-top:1px solid #18241B"></span>Conferido por (dono)</span></div>
  </div></div>
  <div class="foot">

    <button class="ok brilho" data-act="enviar">${I.send}Enviar ficha para a gestão</button>
    <button class="btn" style="height:44px;background:transparent;color:#1E5631" data-act="pdf">Baixar PDF</button>`}
  </div>` + vDialog();
}

function textoZap() {
  const R = resumo();
  let t = `*Ficha de entrega ${S.data}*\n${CARRO.nome}: saiu ${S.carro.p + S.carro.m + S.carro.g}, entregou ${R.e.p + R.e.m + R.e.g}, voltou ${R.nc.p + R.nc.m + R.nc.g}\n\n`;
  t += `💰 Total entregue: ${brl(R.vTotal)}\n🔵 PIX pendente: ${brl(R.vPix)} (${R.pix.length} clientes)\n💵 Dinheiro com o motorista: ${brl(R.dinheiro)}${R.comb ? ' − combustível ' + brl(R.comb) + ' = entregar ' + brl(R.entregar) : ''}\n`;
  if (R.recs.length) t += `🧾 Recibos: ${R.recs.map((r) => 'nº ' + String(r.n).padStart(4, '0') + ' ' + r.nome + ' ' + brl(r.total)).join(', ')}\n`;
  if (R.difs.length) t += `⚠️ Diferenças: ${R.difs.map((c) => c.nome + ' ' + diffTag(c)).join(', ')}\n`;
  if (R.pend.length) t += `Não entregue: ${R.pend.map((c) => c.nome).join(', ')}\n`;
  if (S.abast.valor) t += `⛽ Abasteceu R$ ${S.abast.valor}${S.abast.forma ? ' (' + S.abast.forma + ')' : ''}${S.abast.foto ? ' – comprovante no PDF' : ' – sem comprovante'}\n`;
  if (S.obs) t += `\nObs.: ${S.obs}`;
  return t;
}

    return `<div class="ov ${fx.sheet ? 'open' : ''}"><div class="sheet" role="dialog" aria-label="Confirmar diferença">

    </div></div>`;

  if (d && d.t === 'gps') {
    return `<div class="ov ${fx.sheet ? 'open' : ''}"><form class="sheet" id="fgps">
      <b style="font-size:18px">Salvar local manualmente</b>
      <span style="font-size:14px;color:#2E3B32">${esc(d.msg || 'O GPS não respondeu.')} No Google Maps, toque e segure no ponto do cliente, copie as coordenadas e cole aqui (ou cole o link do local).</span>

}

carregarVozes(); try { speechSynthesis.onvoiceschanged = carregarVozes; } catch (e) {}

  const pt = vozes.filter((v) => /^pt(-|_)?BR/i.test(v.lang) || /portugu[eê]s.*brasil/i.test(v.name));
  const lista = pt.length ? pt : vozes.filter((v) => /^pt/i.test(v.lang));

    || lista.find((v) => /francisca|luciana|thalita|vit[oó]ria|fernanda|maria|leila|female|feminin/i.test(v.name))

}

function trocarTela(view) {

function conta(id) { const c = S.dono.contas; if (!c[id]) c[id] = { p: 0, m: 0, g: 0, ajuste: 0 }; return c[id]; }
function saldoR(id) { const c = S.dono && S.dono.contas && S.dono.contas[id]; if (!c) return 0; return Math.round((valorDe(c.p, c.m, c.g) + (c.ajuste || 0)) * 100) / 100; }

function conferencia() {
  return S.clientes.filter((c) => c.done).map((c) => {
    const antes = saldoR(c.id); const hoje = c.din ? 0 : val(c); const dinPend = c.pendOn ? +c.pendDin || 0 : 0;
    const depois = Math.round((antes + hoje - dinPend) * 100) / 100;
    const alerta = dinPend > antes + 0.001 ? `recebeu ${brl(dinPend)} de pendência em dinheiro, mas devia ${brl(antes)}` : '';
    return { c, antes, hoje, dinPend, depois, alerta };
  });
}

function prazoTxt() {
  const agora = new Date(); const lim = new Date(); lim.setHours(HORA_LIMITE, 0, 0, 0);

  if (min <= 0) return { aberto: false, txt: 'Prazo de hoje encerrado às ' + HORA_LIMITE + 'h. Quem não enviou o comprovante entra na cobrança de bom dia.' };
  const hh = Math.floor(min / 60); const mm = min % 60;
  return { aberto: true, txt: 'Prazo até as ' + HORA_LIMITE + 'h · faltam ' + (hh ? hh + 'h' : '') + String(mm).padStart(hh ? 2 : 1, '0') + 'min' };
}

function darBaixa(id, valor, extra) {
  if (!id || !(valor > 0)) { toast('Escolha o cliente e o valor.'); return false; }

function semearHistorico() {
  // Histórico de exemplo dos últimos 29 dias (só para demonstração). Marcado com demo: true.
  const D = S.dono; D.vendas = []; let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const hoje = new Date(); hoje.setHours(12, 0, 0, 0);
  const ultimas = {};
  for (let k = 29; k >= 1; k--) {
    const ts = hoje.getTime() - k * 86400000; const dt = new Date(ts); if (dt.getDay() === 0) continue;
    CLIENTES.forEach((c, i) => {

      const it = { p: v(c[1]), m: v(c[2]), g: v(c[3]) }; if (it.p + it.m + it.g === 0) it.p = 1;

async function pdfDeElemento(el, nome, btn, rotulo) {

    const pw = pdf.internal.pageSize.getWidth(); const ph = pdf.internal.pageSize.getHeight();
    const pxPorPag = Math.floor(canvas.width * ph / pw);
    for (let y = 0, pg = 0; y < canvas.height; y += pxPorPag, pg++) {
      const fatia = document.createElement('canvas'); fatia.width = canvas.width; fatia.height = Math.min(pxPorPag, canvas.height - y);
      const ctx = fatia.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, fatia.width, fatia.height); ctx.drawImage(canvas, 0, -y);
      if (pg) pdf.addPage();
      pdf.addImage(fatia.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, pw, fatia.height * pw / canvas.width);
    }
    const blob = pdf.output('blob'); let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (dl) await dl.save({ filename: nome, data: blob }); else pdf.save(nome);
  } catch (e) { toast('Não foi possível gerar o PDF.'); }
  if (btn) { btn.disabled = false; btn.textContent = rotulo; }
}

function aplicarPedidos(lista) {
  const avisos = []; let n = 0;
  (lista || []).forEach((pd) => {
    const nome = norm(pd.cliente);
    const idx = CLIENTES.findIndex((c) => norm(c[0]) === nome) >= 0 ? CLIENTES.findIndex((c) => norm(c[0]) === nome) : CLIENTES.findIndex((c) => nome && (nome.includes(norm(c[0])) || norm(c[0]).includes(nome)));
    if (idx < 0) { avisos.push('Cliente não cadastrado: ' + pd.cliente + ' (fale com o desenvolvimento para incluir na rota)'); return; }
    const id = idx + 1;
    S.dono.draft[id] = { p: Math.max(0, +pd.p || 0), m: Math.max(0, +pd.m || 0), g: Math.max(0, +pd.g || 0) };
    S.dono.lido[id] = pd.trecho || 'pedido lido';
    n++;
  });
  return { avisos, n };
}
function parserSimples(txt) {
  const out = [];
  txt.split(/\n+/).forEach((linha) => {
    const l = norm(linha); if (!l) return;
    const idx = CLIENTES.findIndex((c) => l.includes(norm(c[0])));
    if (idx < 0) { if (/\d/.test(l)) out.push({ cliente: linha.trim().slice(0, 40), p: 0, m: 0, g: 0 }); return; }
    const pd = { cliente: CLIENTES[idx][0], p: 0, m: 0, g: 0, trecho: linha.trim().slice(0, 80) };
    const resto = l.replace(norm(CLIENTES[idx][0]), ' ');
    const re = /(\d+)\s*(p\b|pequen\w*|m\b|medi\w*|sujo\w*|bruto\w*|s\b|g\b|grand\w*)?/g; let m; let achou = false;
    while ((m = re.exec(resto))) { achou = true; const s = (m[2] || 'm')[0]; pd[s === 'p' ? 'p' : (s === 'g' || s === 's' || s === 'b') ? 'g' : 'm'] += +m[1]; }
    if (!achou && /nao|não|hoje nao/.test(l)) achou = true;
    if (achou) out.push(pd);
  });
  return out;
}
async function lerPedidos() {
  const txt = (document.getElementById('txtped') || {}).value || '';

    const r = aplicarPedidos(parserSimples(txt)); S.dono.avisos = r.avisos; save(); render(); toast(r.n + ' pedidos preenchidos'); return;
  }

Os tamanhos são: P (feixe limpo pequeno), M (feixe limpo médio) e Bruto (feixe bruto, do jeito que vem do mato; o cliente pode dizer "bruto" ou "sujo") — no JSON use "g" para Bruto.
Os clientes mandam o pedido do dia seguinte pelo WhatsApp. Leia ${fotosPedidos.length ? 'os prints de conversas do WhatsApp anexados' : ''}${fotosPedidos.length && txt.trim() ? ' e ' : ''}${txt.trim() ? 'as mensagens coladas abaixo' : ''} e extraia o pedido de cada cliente.

Regras: use o nome exatamente como na lista quando for o mesmo cliente (o nome do contato no print pode ser parecido). Se o tamanho não for dito, use M e avise. Se o cliente disse que não quer amanhã, mande p, m e g = 0. Ignore mensagens que não são pedido. Some se o mesmo cliente pediu mais de uma vez.
Responda somente com JSON neste formato:
{"pedidos":[{"cliente":"Paiaguás","p":3,"m":0,"g":0,"trecho":"frase curta da mensagem"}],"avisos":["texto curto"]}
${txt.trim() ? '\nMensagens coladas:\n' + txt.slice(0, 20000) : ''}`;
  try {

    const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    S.abast.foto = cv.toDataURL('image/jpeg', 0.7);
    if (!save()) { S.abast.foto = cv.toDataURL('image/jpeg', 0.45); if (!save()) { S.abast.foto = null; toast('Sem espaço para guardar a foto.'); render(); return; } }
    render(); toast('Comprovante anexado');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Não consegui abrir essa foto.'); };
  img.src = url;
});

function pegarGps(id) {
  if (!navigator.geolocation) { fx.sheet = true; set({ dialog: { t: 'gps', id, msg: 'Este navegador não liberou o GPS.' } }); return; }
  toast('Pegando localização…');
  navigator.geolocation.getCurrentPosition(
    (p) => salvarGps(id, p.coords.latitude.toFixed(6) + ',' + p.coords.longitude.toFixed(6)),
    () => { fx.sheet = true; set({ dialog: { t: 'gps', id, msg: 'Não consegui pegar o GPS aqui.' } }); },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
  );
}

async function gerarPdf(btn) {
  const el = document.getElementById('ficha');
  if (!window.html2canvas || !window.jspdf) { toast('Sem internet para gerar o PDF agora.'); return; }
  btn.disabled = true; btn.textContent = 'Gerando PDF…';
  try {
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#ffffff' });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
    const pw = pdf.internal.pageSize.getWidth(); const ph = pdf.internal.pageSize.getHeight();
    let w = pw; let h = canvas.height * w / canvas.width;
    if (h > ph) { w = w * ph / h; h = ph; }
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', (pw - w) / 2, 0, w, h);
    const nome = 'ficha-' + S.data.replace(/\//g, '-') + '.pdf';
    const blob = pdf.output('blob');
    let dl = null;
    try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
    if (dl) { await dl.save({ filename: nome, data: blob }); }
    else { pdf.save(nome); }
  } catch (e) { toast('Não foi possível baixar o PDF.'); }
  btn.disabled = false; btn.textContent = 'Baixar PDF';
}

  D.carga = { p: String(FICHA_1611.carga.p), m: String(FICHA_1611.carga.m), g: String(FICHA_1611.carga.g) }; D.dataIso = FICHA_1611.dataIso;
  return faltou;
}

}
function zerarApp() {
  const cfg = S.cfg; try { localStorage.removeItem(KEY); } catch (e) {}
  S = novo(); S.cfg = cfg || S.cfg; semearHistorico(); lastCarga = null; lastPct = null; fx.view = true; save(); render(); window.scrollTo(0, 0);
  toast('Demonstração recomeçada do zero');
}
if (!S.cfg) S.cfg = { tema: 'auto', som: true, voz: true };
if (location.hash === '#zerar') { try { localStorage.removeItem(KEY); } catch (e) {} const cfg = S.cfg; S = novo(); S.cfg = cfg; try { history.replaceState(null, '', location.pathname); } catch (e) {} }
if (S.migrarReal) { delete S.migrarReal; const D = S.dono; S.real = true; D.contas = {}; D.vendas = []; D.pix = []; D.historico = []; S.clientes = []; S.carro = { p: 0, m: 0, g: 0 }; carregarFicha1611(); D.tab = 'pedidos'; save(); }
if (S.dono && !S.dono.vendas) { semearHistorico(); save(); }
aplicarTema();
render();
try { if ('serviceWorker' in navigator && window.top === window.self && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
